name: Publish Kodi repo

# Po každém pushi do main sestaví ZIPy + addons.xml a nahraje je do veřejného repa
# AnrielK/repository.anrielK (GitHub Pages). Kodi nabídne aktualizaci jen když
# zvýšíš version v addon.xml.
# Vyžaduje secret KODI_REPO_TOKEN (fine-grained PAT, Contents: Read and write
# pro repository.anrielK).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TARGET: AnrielK/repository.anrielK
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - name: Stáhni cílové repo
        env:
          KODI_REPO_TOKEN: ${{ secrets.KODI_REPO_TOKEN }}
        run: |
          test -n "$KODI_REPO_TOKEN" || { echo "Chybí secret KODI_REPO_TOKEN"; exit 1; }
          git clone "https://x-access-token:${KODI_REPO_TOKEN}@github.com/${TARGET}.git" repo

      - name: Sestav repozitář
        run: python3 src/tools/kodi_repo.py build --out repo

      - name: Publikuj
        working-directory: repo
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Beze změn"; exit 0; fi
          VERSION=$(grep -m1 -o '<addon [^>]*version="[^"]*"' ../src/addon.xml | sed 's/.*version="//;s/"//')
          git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "Publish ${VERSION}"
          git push origin HEAD
